[package]
name = "geoframe-imgpoc"
version = "0.1.0"
edition = "2024"
publish = false
description = "画像処理（JPEG/HEIC デコード・向き補正・縮小・JPEG出力）の技術PoC。本体の geoframe には依存を入れない"

[features]
# HEIC を libheif（システムの共有ライブラリ）で読む。CI・開発機に libheif-dev を要求しないよう既定では外す
heic = ["dep:libheif-rs"]
# libheif 本体を同梱ソースから静的にビルドする（cmake が要る。デコーダプラグインは静的に含まれない）
heic-embedded = ["heic", "libheif-rs/embedded-libheif"]

# メモリアロケータの比較用（musl標準のアロケータは遅いことがある）
mimalloc = ["dep:mimalloc"]
# 純Rustの HEIC デコーダ候補（C依存なし）。比較のためそれぞれ別featureにする
heic-zune = ["dep:zune-heic"]
heic-rs = ["dep:heic-rs"]
heic-oxide = ["dep:heif-oxide"]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
fast_image_resize = "6.1.0"
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.1"
zune-jpeg = "0.5.15"
zune-core = "0.5.1"
# imageが依存するのと同じ版（0.8系）に揃え、lockに2つ入らないようにする
moxcms = "0.8.1"
# libheif 1.17（Ubuntu 24.04 の既定）で動くよう、API は v1_17 までに限る
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"], optional = true }
# 純RustのHEICデコーダ候補。いずれもMIT OR Apache-2.0（`heic`クレートはAGPL-3.0なので候補から外した）
zune-heic = { version = "0.5.0", optional = true }
heic-rs = { version = "0.1.4", optional = true }
heif-oxide = { version = "0.1.0", optional = true }
mimalloc = { version = "0.1.48", optional = true, default-features = false }
