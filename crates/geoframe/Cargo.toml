[package]
name = "geoframe"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util"] }

[dev-dependencies]
# 契約テストで応答を JSON Schema と突き合わせる。Schema は内部参照（`#/$defs/...`）だけなので、HTTP・ファイルの
# 参照解決（reqwest/rustls）は要らない
jsonschema = { version = "0.60.1", default-features = false }
