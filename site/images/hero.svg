<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4ec"/><stop offset="1" stop-color="#efe7da"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e4dccd" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2a2e" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2a2e" flood-opacity="0.16"/>
    </filter>
    <!-- 写真の絵柄（実在の場所ではない） -->
    <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc7d6"/><stop offset="1" stop-color="#e6f0ec"/></linearGradient>
    <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d4f74"/><stop offset=".55" stop-color="#d98a5b"/><stop offset="1" stop-color="#f3c27a"/></linearGradient>
    <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18223a"/><stop offset="1" stop-color="#36486b"/></linearGradient>
    <linearGradient id="skyAutumn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe2e6"/><stop offset="1" stop-color="#f4ead6"/></linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8f99"/><stop offset="1" stop-color="#2b5f6a"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6a26a"/><stop offset="1" stop-color="#5a5f78"/></linearGradient>

    <symbol id="pMountain" viewBox="0 0 200 140">
      <rect width="200" height="140" fill="url(#skyDay)"/>
      <circle cx="160" cy="30" r="12" fill="#fff6dc"/>
      <path d="M0 95 L45 45 L70 70 L105 25 L150 80 L175 60 L200 80 V140 H0Z" fill="#6f8790"/>
      <path d="M105 25 L92 42 L100 40 L106 47 L112 39 L118 44Z" fill="#f7f7f2"/>
      <path d="M0 105 L40 80 L85 98 L130 85 L200 100 V140 H0Z" fill="#3f6a52"/>
      <rect y="108" width="200" height="32" fill="url(#lake)"/>
      <path d="M20 118h40M90 126h60M150 116h30" stroke="#cfe6e6" stroke-width="2" opacity=".6"/>
    </symbol>
    <symbol id="pSea" viewBox="0 0 200 140">
      <rect width="200" height="140" fill="url(#skyDusk)"/>
      <circle cx="120" cy="86" r="18" fill="#ffe0a3"/>
      <rect y="88" width="200" height="52" fill="url(#sea)"/>
      <path d="M95 96h50M105 104h30M110 112h20" stroke="#ffe0a3" stroke-width="2.5" opacity=".7"/>
      <path d="M0 88 L30 70 L52 88Z" fill="#3a3550"/>
      <path d="M150 140 L170 112 L200 104 V140Z" fill="#2b2c40"/>
    </symbol>
    <symbol id="pForest" viewBox="0 0 200 140">
      <rect width="200" height="140" fill="url(#skyAutumn)"/>
      <path d="M0 80 Q60 50 120 70 T200 60 V140 H0Z" fill="#c9a25a"/>
      <g fill="#c4582f"><circle cx="30" cy="85" r="22"/><circle cx="70" cy="78" r="26"/><circle cx="150" cy="82" r="24"/></g>
      <g fill="#e09a3a"><circle cx="110" cy="88" r="24"/><circle cx="185" cy="90" r="20"/><circle cx="50" cy="100" r="18"/></g>
      <path d="M0 115 Q100 100 200 118 V140 H0Z" fill="#7a5b3a"/>
      <path d="M60 140 Q100 112 140 140" fill="#b88a55"/>
    </symbol>
    <symbol id="pNight" viewBox="0 0 200 140">
      <rect width="200" height="140" fill="url(#skyNight)"/>
      <g fill="#f3ece0" opacity=".8"><circle cx="30" cy="20" r="1.5"/><circle cx="80" cy="12" r="1.2"/><circle cx="150" cy="25" r="1.5"/><circle cx="180" cy="10" r="1"/></g>
      <path d="M0 140 V70 h30 v-20 h25 v35 h20 v-45 h30 v40 h25 v-25 h30 v30 h40 V140Z" fill="#202a3c"/>
      <g fill="#f2c26b"><rect x="8" y="80" width="6" height="6"/><rect x="38" y="60" width="6" height="6"/><rect x="38" y="76" width="6" height="6"/><rect x="82" y="50" width="6" height="6"/><rect x="92" y="66" width="6" height="6"/><rect x="112" y="78" width="6" height="6"/><rect x="140" y="64" width="6" height="6"/><rect x="170" y="90" width="6" height="6"/><rect x="60" y="96" width="6" height="6"/></g>
      <path d="M0 130 H200" stroke="#f2c26b" stroke-width="3" opacity=".5"/>
    </symbol>
    <symbol id="pSnow" viewBox="0 0 200 140">
      <rect width="200" height="140" fill="#dfe8ee"/>
      <path d="M0 100 L60 30 L95 65 L130 20 L200 95 V140 H0Z" fill="#a7b8c4"/>
      <path d="M60 30 L45 48 L60 44 L72 52 L80 48Z M130 20 L114 40 L128 36 L140 46 L150 40Z" fill="#fff"/>
      <path d="M0 110 Q100 92 200 112 V140 H0Z" fill="#f5f7f8"/>
      <g fill="#3e5a52"><path d="M30 118 l8 -22 l8 22z"/><path d="M150 120 l9 -26 l9 26z"/><path d="M170 122 l7 -18 l7 18z"/></g>
    </symbol>

    <clipPath id="mapClip"><rect x="470" y="110" width="640" height="580" rx="26"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#1d5b66"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)" opacity=".7"/>

  <!-- 1. 集める: 整理前の写真の山 -->
  <g filter="url(#shadow)">
    <g transform="translate(118 420) rotate(-11)"><rect x="-8" y="-8" width="216" height="156" rx="6" fill="#fffdf8"/><use href="#pSnow" width="200" height="140"/></g>
    <g transform="translate(200 470) rotate(7)"><rect x="-8" y="-8" width="216" height="156" rx="6" fill="#fffdf8"/><use href="#pNight" width="200" height="140"/></g>
    <g transform="translate(90 250) rotate(5)"><rect x="-8" y="-8" width="216" height="156" rx="6" fill="#fffdf8"/><use href="#pForest" width="200" height="140"/></g>
    <g transform="translate(205 180) rotate(-6)"><rect x="-8" y="-8" width="216" height="156" rx="6" fill="#fffdf8"/><use href="#pSea" width="200" height="140"/></g>
  </g>
  <!-- 取り込み元: フォルダとクラウド -->
  <g transform="translate(110 640)" opacity=".9">
    <path d="M0 10 h40 l10 10 h60 v62 h-110z" fill="#d9a35b"/>
    <path d="M0 30 h110 v52 h-110z" fill="#e7b979"/>
    <g transform="translate(160 18)"><path d="M20 60 h86 a22 22 0 0 0 0 -44 a32 32 0 0 0 -60 -6 a24 24 0 0 0 -26 50z" fill="#9fbcc0"/></g>
  </g>

  <!-- 流れ1 -->
  <path d="M405 400 C 420 400, 435 400, 452 400" stroke="#1d5b66" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M395 330 C 420 340, 425 370, 420 395" stroke="#1d5b66" stroke-width="4" fill="none" stroke-dasharray="2 10" stroke-linecap="round" opacity=".6"/>

  <!-- 2. 整える: 地図の上のカタログ -->
  <g filter="url(#shadow)"><rect x="470" y="110" width="640" height="580" rx="26" fill="#f3ead9"/></g>
  <g clip-path="url(#mapClip)">
    <path d="M470 560 C 560 520, 620 600, 720 570 S 900 640, 1110 590 V690 H470Z" fill="#cfe0dd"/>
    <path d="M470 600 C 560 570, 640 640, 740 610 S 920 670, 1110 640" stroke="#b9d2cf" stroke-width="2" fill="none"/>
    <g fill="none" stroke="#d8c9ad" stroke-width="2">
      <ellipse cx="760" cy="300" rx="230" ry="150"/><ellipse cx="770" cy="295" rx="180" ry="115"/>
      <ellipse cx="780" cy="290" rx="130" ry="82"/><ellipse cx="795" cy="285" rx="82" ry="50"/>
      <ellipse cx="805" cy="282" rx="38" ry="22"/>
      <ellipse cx="1010" cy="460" rx="120" ry="80"/><ellipse cx="1015" cy="458" rx="75" ry="48"/>
      <ellipse cx="560" cy="200" rx="110" ry="70"/><ellipse cx="560" cy="200" rx="60" ry="36"/>
    </g>
    <path d="M470 470 C 600 450, 700 480, 860 440 S 1040 380, 1110 360" stroke="#e0cfa9" stroke-width="6" fill="none"/>
  </g>
  <!-- 旅の経路 -->
  <path d="M560 470 C 610 380, 640 300, 700 250 S 860 200, 900 320 S 960 480, 1010 520" stroke="#b9772a" stroke-width="4" fill="none" stroke-dasharray="3 11" stroke-linecap="round"/>
  <!-- ピンと写真 -->
  <g filter="url(#soft)">
    <g transform="translate(520 300) rotate(-4)"><rect x="-6" y="-6" width="132" height="96" rx="5" fill="#fffdf8"/><use href="#pForest" width="120" height="84"/></g>
    <g transform="translate(720 140) rotate(3)"><rect x="-6" y="-6" width="132" height="96" rx="5" fill="#fffdf8"/><use href="#pMountain" width="120" height="84"/></g>
    <g transform="translate(930 230) rotate(-3)"><rect x="-6" y="-6" width="132" height="96" rx="5" fill="#fffdf8"/><use href="#pSnow" width="120" height="84"/></g>
    <g transform="translate(860 540) rotate(4)"><rect x="-6" y="-6" width="132" height="96" rx="5" fill="#fffdf8"/><use href="#pSea" width="120" height="84"/></g>
  </g>
  <g>
    <g transform="translate(560 470)"><path d="M0 0c-14-16-22-26-22-36a22 22 0 0 1 44 0c0 10-8 20-22 36z" fill="#1d5b66"/><circle cy="-36" r="8" fill="#d9a35b"/></g>
    <g transform="translate(700 250)"><path d="M0 0c-14-16-22-26-22-36a22 22 0 0 1 44 0c0 10-8 20-22 36z" fill="#1d5b66"/><circle cy="-36" r="8" fill="#d9a35b"/></g>
    <g transform="translate(900 320)"><path d="M0 0c-14-16-22-26-22-36a22 22 0 0 1 44 0c0 10-8 20-22 36z" fill="#1d5b66"/><circle cy="-36" r="8" fill="#d9a35b"/></g>
    <g transform="translate(1010 520)"><path d="M0 0c-14-16-22-26-22-36a22 22 0 0 1 44 0c0 10-8 20-22 36z" fill="#b9772a"/><circle cy="-36" r="8" fill="#fffdf8"/></g>
  </g>
  <!-- 品質の印（星）とお気に入り -->
  <g fill="#b9772a">
    <path transform="translate(845 150) scale(.9)" d="M0 -14 L4 -4 L15 -4 L6 3 L9 14 L0 7 L-9 14 L-6 3 L-15 -4 L-4 -4Z"/>
    <path transform="translate(985 552) scale(.9)" d="M0 -14 L4 -4 L15 -4 L6 3 L9 14 L0 7 L-9 14 L-6 3 L-15 -4 L-4 -4Z"/>
  </g>

  <!-- 流れ2 -->
  <path d="M1120 400 C 1150 400, 1165 400, 1190 400" stroke="#1d5b66" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- 3. 見せる: フォトフレーム（表示は miharashi） -->
  <g filter="url(#shadow)">
    <rect x="1200" y="230" width="340" height="250" rx="16" fill="#1f2a2e"/>
    <svg x="1218" y="248" width="304" height="214" viewBox="0 0 200 140" preserveAspectRatio="xMidYMid slice"><use href="#pMountain" width="200" height="140"/></svg>
    <path d="M1340 480 L1320 560 h100 L1400 480Z" fill="#2b393e"/>
    <rect x="1290" y="556" width="160" height="12" rx="6" fill="#1f2a2e"/>
  </g>
</svg>
