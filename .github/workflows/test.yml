name: テスト

# ブランチへの push と PR で同じ試験が二重に回らないよう、push は main だけにする。
# 文書だけの変更で Rust と配布スクリプトの試験を回さないよう、変更の範囲を見てジョブを選ぶ（changes ジョブ）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: 変更の範囲
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 変更されたファイルから、回すジョブを決める
        id: scope
        # 比べる元が分からないとき（手動起動・新しいブランチ・履歴の書き換え）は全部回す。
        # Rust の試験はコードのほか、埋め込む画面（web/）と、環境変数の一覧（docs/reference/configuration.md）を読む
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all() { echo "rust=true" >>"$GITHUB_OUTPUT"; echo "deploy=true" >>"$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = workflow_dispatch ] && all
          case "$BASE" in ''|0000000000000000000000000000000000000000) all ;; esac
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA") || all
          printf '%s\n' "$files"
          workflow='^\.github/workflows/test\.yml$'
          if printf '%s\n' "$files" | grep -qE "^(crates/|web/|Cargo\.(toml|lock)$|docs/reference/configuration\.md$)|$workflow"; then
            echo "rust=true" >>"$GITHUB_OUTPUT"
          else
            echo "rust=false" >>"$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$files" | grep -qE "^deploy/|$workflow"; then
            echo "deploy=true" >>"$GITHUB_OUTPUT"
          else
            echo "deploy=false" >>"$GITHUB_OUTPUT"
          fi

  docs:
    name: 文書・道具
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Markdown相対リンク検査
        # システムの python3（標準ライブラリだけ。pip も setup-python も使わない）
        run: python3 tools/check_markdown_links.py

      - name: 紹介ページ（site/）の検査
        # 内部リンク・fragment・資産の存在、外部ホストの許可リスト、スクリプト・外部フォント・データファイルが無いこと。標準ライブラリだけ
        run: |
          python3 tools/check_site.py
          python3 -m unittest discover -s tools/tests -v

      - name: 毎朝のDecision起動（deploy/loc_decision_morning.py）の試験
        # 本番機のシステムの python3 で動く標準ライブラリだけのスクリプト。pip install なし
        run: python3 -m unittest discover -s deploy/tests -v

  deploy:
    name: 配布スクリプト（モックの試験）
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: rust-deploy.sh（検証環境・本番の指定・復元・数の引数）
        # 実機の systemd・ssh・/etc には触れない。モックの systemctl・curl・hostname を PATH に置き、
        # 一時ディレクトリと一時の git リポジトリだけを使う。sha256sum・stat・install・setsid などは
        # ubuntu のランナーの標準のもの（coreutils・util-linux）。ランナーは root ではない
        run: bash deploy/rust-deploy-test.sh

      - name: geoframe-admin.sh（サービスと同じユーザー・設定で動かす）
        run: bash deploy/geoframe-admin-test.sh

  rust:
    name: Rust（fmt・clippy・test・musl静的ビルド）
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Rustを準備
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: musl-toolsをインストール
        # rusqlite の bundled が SQLite（C）をビルドするため、musl 用の C コンパイラが要る
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cargoのキャッシュ
        uses: Swatinem/rust-cache@v2

      - name: フォーマット検査
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rustテスト
        # 画面描画の試験（web/tests/admin_ai_ops_render.mjs を Node で動かす。tests/admin_ui_ai_waits.rs）と、
        # コードが読む環境変数が docs/reference/configuration.md に載っているかの検査（tests/env_reference.rs）、
        # crates に python の起動が無いことの検査（tests/no_python.rs）もここで回る。CI では Node が無ければ失敗にする
        run: cargo test

      - name: muslで静的ビルド
        # 画像処理（P2 / T2.2）も同じバイナリに入る: HEICは純Rustのzune-heic（libheifなし）、
        # アロケータはmuslのときだけmimalloc（Cをccでビルドする。上のmusl-toolsが要る）
        run: cargo build --release --target x86_64-unknown-linux-musl -p geoframe

      - name: 静的リンクの検査
        run: |
          bin=target/x86_64-unknown-linux-musl/release/geoframe
          ls -l "$bin"
          file "$bin"
          file "$bin" | grep -E 'statically linked|static-pie linked'
          # 動的リンクなら ldd は共有ライブラリを列挙する。静的なら "not a dynamic executable" 等になる
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "動的ライブラリにリンクされています" >&2
            exit 1
          fi
          "$bin" --version
          # 画像処理（JPEG・PNG・HEIC）が静的バイナリで動くこと。HEICは純Rustのzune-heic。
          # img-probeはDB・データ置き場に触れない。合成のHEIC（写真ではない）を2枚、1枚はICC付き
          "$bin" img-probe crates/geoframe/tests/fixtures/synthetic_o6.heic crates/geoframe/tests/fixtures/synthetic_p3.heic
