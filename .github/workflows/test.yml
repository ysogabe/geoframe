name: テスト

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Python・文書
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Python依存関係をインストール
        run: python -m pip install -r app/requirements.txt

      - name: Pythonテスト
        working-directory: app
        run: python -m unittest discover -s tests

      - name: Markdown相対リンク検査
        run: python3 tools/check_markdown_links.py

      - name: 設定リファレンスの同期検査
        run: python3 tools/gen_env_reference.py --check

      - name: スキーマのフィクスチャの同期検査
        # Rust のスキーマ（crates/geoframe/src/schema.rs）が Python の空 DB と一致することを確かめる
        # テストの Golden。store.py の SCHEMA を変えたら tools/gen_schema_fixture.py で再生成する
        run: python3 tools/gen_schema_fixture.py --check

  rust:
    name: Rust（fmt・clippy・test・musl静的ビルド）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Rustを準備
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: musl-toolsをインストール
        # rusqlite の bundled が SQLite（C）をビルドするため、musl 用の C コンパイラが要る
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cargoのキャッシュ
        uses: Swatinem/rust-cache@v2

      - name: フォーマット検査
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rustテスト
        run: cargo test

      - name: "Rustテスト（画像PoC: 純RustのHEIC zune-heic。libheifなし）"
        run: cargo test -p geoframe-imgpoc --features heic-zune

      - name: muslで静的ビルド
        # 本体のgeoframe。画像PoC（geoframe-imgpoc）は下の別の手順で、libheifなしの構成だけを検査する
        run: cargo build --release --target x86_64-unknown-linux-musl -p geoframe

      - name: 静的リンクの検査
        run: |
          bin=target/x86_64-unknown-linux-musl/release/geoframe
          ls -l "$bin"
          file "$bin"
          file "$bin" | grep -E 'statically linked|static-pie linked'
          # 動的リンクなら ldd は共有ライブラリを列挙する。静的なら "not a dynamic executable" 等になる
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "動的ライブラリにリンクされています" >&2
            exit 1
          fi
          "$bin" --version

      - name: "muslで静的ビルド（画像PoC: zune-heic＋mimalloc）"
        # 推奨構成の柱「HEICをzune-heicにすればmusl静的に入る」（docs/rust-migration/image-poc.md）の検証。
        # libheifは入れない。mimallocはCをccでビルドする（上のmusl-toolsが要る）
        run: cargo build --release --target x86_64-unknown-linux-musl -p geoframe-imgpoc --features heic-zune,mimalloc

      - name: 静的リンクの検査（画像PoC）
        run: |
          bin=target/x86_64-unknown-linux-musl/release/geoframe-imgpoc
          ls -l "$bin"
          file "$bin"
          file "$bin" | grep -E 'statically linked|static-pie linked'
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "動的ライブラリにリンクされています" >&2
            exit 1
          fi
          "$bin" --help > /dev/null

  imgpoc-heic:
    name: "画像PoC（HEIC: libheifへ動的リンク）"
    # libheif 1.17.6（Ubuntu 24.04）を前提にしているので、ubuntu-latestではなく固定する
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Rustを準備
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: libheifをインストール
        # libheif-rs（feature heic）がシステムのlibheifへリンクする。HEVCのデコーダはプラグインなので別に要る。
        # libheif.pcがzlibを要求するので、zlib1g-devも明示する
        run: sudo apt-get update && sudo apt-get install -y libheif-dev libheif-plugin-libde265 pkg-config zlib1g-dev

      - name: Cargoのキャッシュ
        uses: Swatinem/rust-cache@v2

      - name: Clippy（全HEIC候補）
        run: cargo clippy -p geoframe-imgpoc --all-targets --features heic,heic-zune,heic-rs,heic-oxide -- -D warnings

      - name: テスト（全HEIC候補）
        run: cargo test -p geoframe-imgpoc --features heic,heic-zune,heic-rs,heic-oxide
