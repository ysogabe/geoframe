name: テスト

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Python・文書
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Python依存関係をインストール
        run: python -m pip install -r app/requirements.txt

      - name: Pythonテスト
        working-directory: app
        run: python -m unittest discover -s tests

      - name: Markdown相対リンク検査
        run: python3 tools/check_markdown_links.py

      - name: 設定リファレンスの同期検査
        run: python3 tools/gen_env_reference.py --check
