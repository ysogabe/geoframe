name: テスト

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Python・JavaScript・文書
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Python依存関係をインストール
        run: python -m pip install -r app/requirements.txt

      - name: Pythonテスト
        working-directory: app
        run: python -m unittest discover -s tests

      - name: JavaScriptテスト
        working-directory: app
        run: node tests/js/scheduler-quality.test.js

      - name: Markdown相対リンク検査
        run: python tools/check_markdown_links.py

  mac-wkwebview:
    name: macOS WKWebView
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Swiftテスト
        run: swift test --package-path mac-wkwebview
