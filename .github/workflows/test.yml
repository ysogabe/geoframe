name: テスト

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Python・文書
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Python依存関係をインストール
        run: python -m pip install -r app/requirements.txt

      - name: Pythonテスト
        working-directory: app
        run: python -m unittest discover -s tests

      - name: Markdown相対リンク検査
        run: python3 tools/check_markdown_links.py

      - name: 設定リファレンスの同期検査
        run: python3 tools/gen_env_reference.py --check

      - name: EXIF・縮小寸法のフィクスチャの同期検査
        # Rust の画像処理（crates/geoframe/src/imaging）が Python の extract_exif・norm_time・Pillow の
        # thumbnail と同じ結果になることを確かめるテストの基準。Python の読み取りが変わったら落ちる
        run: |
          python3 tools/gen_exif_fixture.py --check
          python3 tools/gen_thumbnail_fixture.py --check

      - name: スキーマのフィクスチャの同期検査
        # Rust のスキーマ（crates/geoframe/src/schema.rs）が Python の空 DB と一致することを確かめる
        # テストの Golden。store.py の SCHEMA を変えたら tools/gen_schema_fixture.py で再生成する
        run: python3 tools/gen_schema_fixture.py --check

  rust:
    name: Rust（fmt・clippy・test・musl静的ビルド）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Rustを準備
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: musl-toolsをインストール
        # rusqlite の bundled が SQLite（C）をビルドするため、musl 用の C コンパイラが要る
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cargoのキャッシュ
        uses: Swatinem/rust-cache@v2

      - name: フォーマット検査
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rustテスト
        run: cargo test

      - name: muslで静的ビルド
        # 画像処理（P2 / T2.2）も同じバイナリに入る: HEICは純Rustのzune-heic（libheifなし）、
        # アロケータはmuslのときだけmimalloc（Cをccでビルドする。上のmusl-toolsが要る）
        run: cargo build --release --target x86_64-unknown-linux-musl -p geoframe

      - name: 静的リンクの検査
        run: |
          bin=target/x86_64-unknown-linux-musl/release/geoframe
          ls -l "$bin"
          file "$bin"
          file "$bin" | grep -E 'statically linked|static-pie linked'
          # 動的リンクなら ldd は共有ライブラリを列挙する。静的なら "not a dynamic executable" 等になる
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "動的ライブラリにリンクされています" >&2
            exit 1
          fi
          "$bin" --version
          # 画像処理（JPEG・PNG・HEIC）が静的バイナリで動くこと。HEICは純Rustのzune-heic。
          # img-probeはDB・データ置き場に触れない。合成のHEIC（写真ではない）を2枚、1枚はICC付き
          "$bin" img-probe crates/geoframe/tests/fixtures/synthetic_o6.heic crates/geoframe/tests/fixtures/synthetic_p3.heic
